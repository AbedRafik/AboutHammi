<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- HAMMI mark: near-black squircle with a quiet crimson gradient
       drifting through it, a crimson rim, and a white H. The dark frame
       lets the mark sit calmly inside browser chrome. -->
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#190a0d"/>
      <stop offset="55%" stop-color="#240a12"/>
      <stop offset="100%" stop-color="#3d0f1e"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff8494" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#8a0d22" stop-opacity="0.25"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="#070304"/>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bg)"/>
  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="14.25" fill="none" stroke="url(#rim)" stroke-width="1.5"/>
  <text x="32" y="43" text-anchor="middle" font-family="Noto Sans, DejaVu Sans, sans-serif" font-weight="800" font-size="32" fill="#ffffff">H</text>
</svg>
